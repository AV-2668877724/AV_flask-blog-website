{% extends "base.html" %} {% block title %}Complete Registration{% endblock %}
{% block content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card shadow border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold font-heading">Final Step</h2>
          <p class="text-muted small">Set your unique identity</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-user text-muted"></i>
              </span>
              <input
                type="text"
                class="form-control border-start-0 border-end-0 ps-0 bg-light"
                name="username"
                id="signupUsername"
                placeholder="Choose a unique username"
                required
                autocomplete="off"
                pattern="[a-zA-Z0-9_.]+"
                title="Letters, numbers, dots, and underscores only."
                onkeyup="resetSignupCheck()"
              />
              <button
                class="btn btn-danger fw-bold"
                type="button"
                id="checkBtn"
                onclick="checkSignupUsername()"
              >
                Check Availability
              </button>
            </div>
            <div id="signupUsernameStatus" class="form-text small mt-2 fw-bold">
              <span class="text-muted"
                >👉 Click "Check Availability" button first</span
              >
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-lock text-muted"></i>
              </span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                name="password"
                placeholder="Create a password"
                required
                minlength="7"
              />
            </div>
            <div class="form-text">Must be at least 7 characters.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small text-muted"
              >Confirm Password</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-lock text-muted"></i>
              </span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                name="confirm_password"
                placeholder="Repeat password"
                required
                minlength="7"
              />
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              id="signupSubmitBtn"
              class="btn btn-primary btn-lg rounded-pill fw-bold"
              disabled
            >
              Create Account
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function checkSignupUsername() {
    const input = document.getElementById("signupUsername");
    const status = document.getElementById("signupUsernameStatus");
    const btn = document.getElementById("signupSubmitBtn");
    const checkBtn = document.getElementById("checkBtn");

    if (input.value.length < 2) {
      status.innerHTML = '<span class="text-danger">Too short</span>';
      return;
    }

    // Disable button while checking
    checkBtn.disabled = true;
    checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

    fetch("/check-username-signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: input.value }),
    })
      .then((res) => res.json())
      .then((data) => {
        checkBtn.disabled = false;
        checkBtn.innerText = "Check Availability";

        if (data.available) {
          status.innerHTML =
            '<span class="text-success"><i class="fas fa-check-circle"></i> ' +
            data.message +
            "</span>";
          btn.disabled = false; // Enable Submit
          input.classList.add("is-valid");
          input.classList.remove("is-invalid");
        } else {
          status.innerHTML =
            '<span class="text-danger"><i class="fas fa-times-circle"></i> ' +
            data.message +
            "</span>";
          btn.disabled = true; // Disable Submit
          input.classList.add("is-invalid");
          input.classList.remove("is-valid");
        }
      })
      .catch((err) => {
        console.error(err);
        checkBtn.disabled = false;
        checkBtn.innerText = "Check Availability";
      });
  }

  function resetSignupCheck() {
    document.getElementById("signupSubmitBtn").disabled = true;
    document.getElementById("signupUsername").classList.remove("is-valid");
    document.getElementById("signupUsernameStatus").innerHTML =
      '<span class="text-muted">👉 Click "Check Availability" button first</span>';
  }
</script>
{% endblock %}
