{% extends "base.html" %} {% block title %}Complete Registration{% endblock %}
{% block content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 75vh"
>
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-5">
          <div
            class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
            style="width: 60px; height: 60px"
          >
            <i class="fas fa-id-badge fa-2x"></i>
          </div>
          <h2 class="fw-bold font-heading">Final Step</h2>
          <p class="text-muted">Set your unique identity</p>
        </div>

        <form method="POST">
          <div class="mb-4">
            <div class="input-group">
              <div class="form-floating flex-grow-1">
                <input
                  type="text"
                  class="form-control bg-light border-0"
                  name="username"
                  id="signupUsername"
                  placeholder="Username"
                  required
                  autocomplete="off"
                  pattern="[a-zA-Z0-9_.]+"
                  title="Letters, numbers, dots, and underscores only."
                  onkeyup="resetSignupCheck()"
                />
                <label for="signupUsername" class="text-muted"
                  ><i class="fas fa-at me-2"></i>Username</label
                >
              </div>
              <button
                class="btn btn-primary fw-bold px-4"
                type="button"
                id="checkBtn"
                onclick="checkSignupUsername()"
              >
                Check
              </button>
            </div>
            <div
              id="signupUsernameStatus"
              class="form-text small mt-2 fw-bold px-2"
            >
              <span class="text-muted">👉 Click "Check" button first</span>
            </div>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control bg-light border-0"
              name="password"
              id="password"
              placeholder="Create a password"
              required
              minlength="7"
            />
            <label for="password" class="text-muted"
              ><i class="fas fa-lock me-2"></i>Create Password</label
            >
            <div class="form-text px-2">Must be at least 7 characters.</div>
          </div>

          <div class="form-floating mb-5">
            <input
              type="password"
              class="form-control bg-light border-0"
              name="confirm_password"
              id="confirm_password"
              placeholder="Repeat password"
              required
              minlength="7"
            />
            <label for="confirm_password" class="text-muted"
              ><i class="fas fa-check-double me-2"></i>Confirm Password</label
            >
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              id="signupSubmitBtn"
              class="btn btn-primary btn-lg rounded-pill fw-bold"
              disabled
            >
              Create Account
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function checkSignupUsername() {
    const input = document.getElementById("signupUsername");
    const status = document.getElementById("signupUsernameStatus");
    const btn = document.getElementById("signupSubmitBtn");
    const checkBtn = document.getElementById("checkBtn");

    if (input.value.length < 2) {
      status.innerHTML = '<span class="text-danger">Too short</span>';
      return;
    }

    // Disable button while checking
    checkBtn.disabled = true;
    checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    fetch("/check-username-signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: input.value }),
    })
      .then((res) => res.json())
      .then((data) => {
        checkBtn.disabled = false;
        checkBtn.innerText = "Check";

        if (data.available) {
          status.innerHTML =
            '<span class="text-success"><i class="fas fa-check-circle"></i> ' +
            data.message +
            "</span>";
          btn.disabled = false; // Enable Submit
          input.classList.add("is-valid");
          input.classList.remove("is-invalid");
        } else {
          status.innerHTML =
            '<span class="text-danger"><i class="fas fa-times-circle"></i> ' +
            data.message +
            "</span>";
          btn.disabled = true; // Disable Submit
          input.classList.add("is-invalid");
          input.classList.remove("is-valid");
        }
      })
      .catch((err) => {
        console.error(err);
        checkBtn.disabled = false;
        checkBtn.innerText = "Check";
      });
  }

  function resetSignupCheck() {
    document.getElementById("signupSubmitBtn").disabled = true;
    document.getElementById("signupUsername").classList.remove("is-valid");
    document.getElementById("signupUsernameStatus").innerHTML =
      '<span class="text-muted">👉 Click "Check" button first</span>';
  }
</script>
{% endblock %}
