{% extends "base.html" %} {% block title %}Verify Email - AV Postory{% endblock
%} {% block content %}
<style>
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color) !important;
    border-radius: 24px;
    box-shadow: var(--shadow-float);
    width: 100%;
    max-width: 420px;
    padding: 3rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: "";
    position: absolute;
    top: -50px;
    right: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(
      circle,
      var(--primary-glow) 0%,
      transparent 70%
    );
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .otp-input {
    font-size: 2rem !important;
    letter-spacing: 0.5rem;
    text-align: center;
    font-weight: bold;
    padding: 1rem !important;
    border-radius: 16px !important;
  }
  .otp-input::placeholder {
    font-size: 1rem;
    letter-spacing: normal;
    font-weight: normal;
  }
</style>

<div class="auth-wrapper fade-in-up">
  <div class="auth-card">
    <div class="auth-content" style="position: relative; z-index: 1">
      <div class="text-center mb-4">
        <div
          class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
          style="width: 64px; height: 64px"
        >
          <i class="fas fa-envelope-open-text fa-2x"></i>
        </div>
        <h3 class="font-heading fw-bold" style="color: var(--text-main)">
          Check your email
        </h3>
        <p class="text-muted small mb-0">We sent a 6-digit code to</p>
        <p class="fw-bold" style="color: var(--text-main)">{{ email }}</p>
      </div>

      <form method="POST" id="otpForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-4">
          <input
            type="text"
            class="form-control otp-input shadow-sm"
            name="otp"
            placeholder="Enter 6-digit OTP"
            required
            maxlength="6"
            autocomplete="off"
            autofocus
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm"
          id="verifyBtn"
        >
          Verify & Continue
        </button>
      </form>

      <div class="text-center mt-4">
        <a
          href="{{ url_for('auth.sign_up') }}"
          class="text-decoration-none small text-muted hover-opacity-100"
        >
          <i class="fas fa-arrow-left me-1"></i> Change email address
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("otpForm").addEventListener("submit", function () {
    const btn = document.getElementById("verifyBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verifying...';
  });
</script>
{% endblock %}
