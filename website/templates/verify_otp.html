{% extends "base.html" %} {% block title %}Verify Email{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card shadow border-0 auth-card">
      <div class="card-body p-4 p-md-5 text-center">
        <i class="fas fa-envelope-open-text fa-3x text-primary mb-3"></i>
        <h3 class="fw-bold">Enter OTP</h3>
        <p class="text-muted small">
          We sent a 6-digit code to <strong>{{ email }}</strong>
        </p>

        <form method="POST">
          <div class="mb-4">
            <input
              type="text"
              class="form-control form-control-lg text-center letter-spacing-2"
              name="otp"
              placeholder="123456"
              maxlength="6"
              required
              style="letter-spacing: 5px; font-weight: bold"
            />
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg rounded-pill fw-bold"
            >
              Verify Code
            </button>
            <a
              href="/sign-up"
              class="btn btn-link text-muted small text-decoration-none"
              >Change Email</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
