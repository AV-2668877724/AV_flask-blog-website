{% extends "base.html" %} {% block title %}Verify Email{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 75vh"
>
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 auth-card">
      <div class="card-body p-4 p-md-5 text-center">
        <div
          class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-4"
          style="width: 70px; height: 70px"
        >
          <i class="fas fa-envelope-open-text fa-2x"></i>
        </div>

        <h3 class="fw-bold font-heading mb-2">Enter OTP</h3>
        <p class="text-muted mb-4">
          We sent a 6-digit code to <br /><strong class="text-dark"
            >{{ email }}</strong
          >
        </p>

        <form method="POST">
          <div class="form-floating mb-4">
            <input
              type="text"
              class="form-control form-control-lg text-center bg-light border-0"
              name="otp"
              id="otp"
              placeholder="123456"
              maxlength="6"
              required
              style="letter-spacing: 12px; font-weight: 700; font-size: 1.5rem"
            />
            <label
              for="otp"
              class="text-muted w-100 text-center"
              style="transform-origin: center; left: 0"
              ><i class="fas fa-key me-2"></i>6-Digit Code</label
            >
          </div>

          <div class="d-grid gap-3">
            <button
              type="submit"
              class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm"
            >
              Verify Code
            </button>
            <a
              href="/sign-up"
              class="btn btn-outline-secondary rounded-pill btn-sm fw-bold w-50 mx-auto mt-2"
              >Change Email</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
