{% extends "base.html" %} {% block title %}New Password - AV Postory{% endblock
%} {% block content %}
<style>
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color) !important;
    border-radius: 24px;
    box-shadow: var(--shadow-float);
    width: 100%;
    max-width: 420px;
    padding: 3rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: "";
    position: absolute;
    bottom: -50px;
    right: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(
      circle,
      var(--primary-glow) 0%,
      transparent 70%
    );
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .auth-content {
    position: relative;
    z-index: 1;
  }

  .password-toggle {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    z-index: 10;
    transition: color 0.2s;
  }
  .password-toggle:hover {
    color: var(--primary);
  }
</style>

<div class="auth-wrapper fade-in-up">
  <div class="auth-card">
    <div class="auth-content">
      <div class="text-center mb-4">
        <h3 class="font-heading fw-bold" style="color: var(--text-main)">
          Create New Password
        </h3>
        <p class="text-muted small">
          Your new password must be different from previously used passwords.
        </p>
      </div>

      <form method="POST" id="newPasswordForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted ms-1"
            >New Password</label
          >
          <div class="position-relative">
            <input
              type="password"
              class="form-control shadow-sm bg-light border-0"
              id="password"
              name="password"
              placeholder="Minimum 7 characters"
              required
            />
            <button
              type="button"
              class="password-toggle"
              onclick="toggleVisibility('password', 'eye1')"
            >
              <i class="far fa-eye" id="eye1"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold small text-muted ms-1"
            >Confirm Password</label
          >
          <div class="position-relative">
            <input
              type="password"
              class="form-control shadow-sm bg-light border-0"
              id="confirm_password"
              name="confirm_password"
              placeholder="Type password again"
              required
            />
            <button
              type="button"
              class="password-toggle"
              onclick="toggleVisibility('confirm_password', 'eye2')"
            >
              <i class="far fa-eye" id="eye2"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm"
          id="updateBtn"
        >
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  // Show/Hide Password function
  function toggleVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }

  // Loading state
  document
    .getElementById("newPasswordForm")
    .addEventListener("submit", function () {
      const btn = document.getElementById("updateBtn");
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating...';
    });
</script>
{% endblock %}
