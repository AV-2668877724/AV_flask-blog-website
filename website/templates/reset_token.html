{% extends "base.html" %} {% block title %}New Password{% endblock %} {% block
content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-3 text-center">New Password</h3>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold small">New Password</label>
            <input
              type="password"
              class="form-control"
              name="password"
              required
            />
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold small">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              name="confirm_password"
              required
            />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Immediately remove dark mode class if present
  document.body.classList.remove("dark-mode");

  // Ensure it stays off even after page load
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.remove("dark-mode");
  });
</script>
{% endblock %}
