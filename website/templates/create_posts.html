{% extends 'base.html' %} {% block title %}Write Story{% endblock %} {% block
content %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

<style>
  /* =========================================
     PREMIUM QUILL EDITOR STYLES
     ========================================= */
  .editor-wrapper {
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    overflow: hidden;
    background-color: var(--bg-card);
    transition: all var(--trans-smooth);
  }
  .editor-wrapper:focus-within {
    box-shadow: 0 0 0 4px var(--primary-glow);
    border-color: var(--primary);
  }

  /* Toolbar Styling */
  .ql-toolbar.ql-snow {
    border: none !important;
    border-bottom: 1px solid var(--border-color) !important;
    background-color: var(--bg-input) !important;
    padding: 12px 20px !important;
  }

  /* Text Area Styling */
  .ql-container.ql-snow {
    border: none !important;
    background-color: transparent !important;
    color: var(--text-main) !important;
    font-size: 1.15rem !important;
    font-family: var(--font-sans) !important;
  }
  .ql-editor {
    min-height: 400px;
    padding: 2rem !important;
    line-height: 1.8;
  }
  .ql-editor.ql-blank::before {
    color: var(--text-muted);
    font-style: italic;
    opacity: 0.7;
    left: 2rem;
  }

  /* Quill Icons & Dark Mode Support */
  body.dark-mode .ql-snow .ql-stroke {
    stroke: var(--text-muted);
  }
  body.dark-mode .ql-snow .ql-fill {
    fill: var(--text-muted);
  }
  body.dark-mode .ql-snow .ql-picker {
    color: var(--text-muted);
  }
  body.dark-mode .ql-snow.ql-toolbar button:hover .ql-stroke,
  body.dark-mode .ql-snow .ql-toolbar button:hover .ql-stroke {
    stroke: var(--primary);
  }

  /* =========================================
     INTERACTIVE IMAGE UPLOAD ZONE
     ========================================= */
  .image-upload-zone {
    border: 2px dashed var(--border-color);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
    cursor: pointer;
    background-color: var(--bg-input);
    transition: all var(--trans-smooth);
  }
  .image-upload-zone:hover {
    border-color: var(--primary);
    background-color: var(--primary-glow);
    transform: translateY(-2px);
  }

  .cover-preview-wrapper {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    display: none; /* Hidden until image is selected */
  }
  .cover-preview-wrapper img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    display: block;
  }
  .btn-remove-cover {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-remove-cover:hover {
    background: rgba(220, 53, 69, 0.9);
    transform: scale(1.1);
  }
</style>

<div class="row justify-content-center fade-in-up">
  <div class="col-lg-10 col-xl-9">
    <div class="d-flex align-items-center mb-4 px-2">
      <div
        class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle me-3 shadow-sm"
        style="width: 54px; height: 54px"
      >
        <i class="fas fa-pen-nib fa-lg"></i>
      </div>
      <div>
        <h2 class="font-heading fw-bold mb-0" style="color: var(--text-main)">
          Create a new story
        </h2>
        <p class="text-muted mb-0" style="font-size: 0.95rem">
          Share your thoughts with the community
        </p>
      </div>
    </div>

    <div
      class="card border-0 shadow-sm p-4 p-md-5 mb-5"
      style="border-radius: 24px; background-color: var(--bg-card)"
    >
      <form
        method="POST"
        id="postForm"
        enctype="multipart/form-data"
        onsubmit="return validatePostForm();"
      >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="hidden" name="text" id="hiddenInput" />

        <div class="mb-4">
          <label
            class="form-label fw-bold small text-uppercase"
            style="color: var(--text-muted); letter-spacing: 0.5px"
          >
            Cover Image <span class="fw-normal text-lowercase">(Optional)</span>
          </label>

          <div
            id="uploadZone"
            class="image-upload-zone"
            onclick="document.getElementById('coverImageInput').click()"
          >
            <i
              class="fas fa-images fa-2x mb-2"
              style="color: var(--text-muted); opacity: 0.6"
            ></i>
            <h6 class="fw-bold mb-1" style="color: var(--text-main)">
              Click to browse files
            </h6>
            <div
              class="small fw-bold opacity-75"
              style="color: var(--text-muted)"
            >
              Supported: JPG, PNG, WEBP (Max 5MB)
            </div>
          </div>

          <input
            type="file"
            name="cover_image"
            id="coverImageInput"
            class="d-none"
            accept="image/*"
            onchange="handleCoverPreview(this)"
          />

          <div id="coverPreviewContainer" class="cover-preview-wrapper mt-3">
            <img id="coverPreview" src="" alt="Cover Preview" />
            <button
              type="button"
              class="btn-remove-cover"
              onclick="removeCoverImage()"
              title="Remove Image"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label
            class="form-label fw-bold small text-uppercase"
            style="color: var(--text-muted); letter-spacing: 0.5px"
          >
            Your Story
          </label>
          <div class="editor-wrapper">
            <div id="editor-container"></div>
          </div>
        </div>

        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-3 mt-4"
        >
          <small
            class="text-muted fw-bold mb-3 mb-md-0 d-flex align-items-center gap-2"
          >
            <i class="fab fa-markdown fs-5"></i> Supports Markdown shortcuts
          </small>

          <div class="d-flex gap-3 w-100 w-md-auto">
            <a
              href="/home"
              class="btn btn-light rounded-pill px-4 fw-bold flex-grow-1 flex-md-grow-0 border shadow-sm"
              style="background-color: var(--bg-input); color: var(--text-main)"
            >
              Cancel
            </a>
            <button
              type="submit"
              class="btn btn-primary rounded-pill px-5 fw-bold flex-grow-1 flex-md-grow-0 shadow-sm d-flex align-items-center justify-content-center gap-2"
            >
              <i class="fas fa-paper-plane" style="font-size: 0.9rem"></i>
              <span>Publish Story</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
  // =========================================
  // 1. INITIALIZE QUILL JS
  // =========================================
  var quill = new Quill("#editor-container", {
    theme: "snow",
    placeholder: "Start typing your masterpiece...",
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ["bold", "italic", "underline", "link", "blockquote"],
        [{ list: "ordered" }, { list: "bullet" }],
        ["clean"],
      ],
    },
  });

  // =========================================
  // 2. IMAGE PREVIEW LOGIC
  // =========================================
  function handleCoverPreview(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();

      reader.onload = function (e) {
        document.getElementById("coverPreview").src = e.target.result;
        document.getElementById("coverPreviewContainer").style.display =
          "block";
        document.getElementById("uploadZone").style.display = "none";
      };

      reader.readAsDataURL(input.files[0]);
    }
  }

  function removeCoverImage() {
    document.getElementById("coverImageInput").value = "";
    document.getElementById("coverPreviewContainer").style.display = "none";
    document.getElementById("uploadZone").style.display = "block";
  }

  // =========================================
  // 3. FORM VALIDATION & SUBMISSION
  // =========================================
  function validatePostForm() {
    var html = quill.root.innerHTML;
    var text = quill.getText().trim();

    if (text.length === 0) {
      if (typeof showToast === "function") {
        showToast("Content cannot be empty!", true);
      } else {
        alert("Content cannot be empty!");
      }
      return false;
    }

    // Inject quill HTML into hidden input for backend to process
    document.getElementById("hiddenInput").value = html;

    // Change button state to loading
    const btn = document.querySelector('button[type="submit"]');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Publishing...';
    btn.disabled = true;

    return true;
  }
</script>
{% endblock %}
