{% extends 'base.html' %} {% block title %}Write Story{% endblock %} {% block
content %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill-mention@3.1.0/dist/quill.mention.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />

<style>
  /* =========================================
     PREMIUM QUILL EDITOR STYLES
     ========================================= */
  .editor-wrapper {
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    background-color: var(--bg-card);
    transition: all var(--trans-smooth);
  }
  .editor-wrapper:focus-within {
    box-shadow: 0 0 0 4px var(--primary-glow);
    border-color: var(--primary);
  }

  /* Toolbar Styling */
  .ql-toolbar.ql-snow {
    border: none !important;
    border-bottom: 1px solid var(--border-color) !important;
    background-color: var(--bg-input) !important;
    padding: 12px 20px !important;
    border-radius: 20px 20px 0 0 !important; 
  }

  /* Text Area Styling */
  .ql-container.ql-snow {
    border: none !important;
    background-color: transparent !important;
    color: var(--text-main) !important;
    font-size: 1.15rem !important;
    font-family: var(--font-sans) !important;
    border-radius: 0 0 20px 20px !important; 
  }
  .ql-editor {
    min-height: 400px;
    padding: 2rem !important;
    line-height: 1.8;
  }
  /* Inline Quill Images styling */
  .ql-editor img {
    border-radius: 12px;
    max-width: 100%;
    margin: 1rem 0;
    box-shadow: var(--shadow-sm);
  }
  
  .ql-editor.ql-blank::before {
    color: var(--text-muted);
    font-style: italic;
    opacity: 0.7;
    left: 2rem;
  }

  /* Quill Icons & Dark Mode Support */
  body.dark-mode .ql-snow .ql-stroke {
    stroke: var(--text-muted);
  }
  body.dark-mode .ql-snow .ql-fill {
    fill: var(--text-muted);
  }
  body.dark-mode .ql-snow .ql-picker {
    color: var(--text-muted);
  }
  body.dark-mode .ql-snow.ql-toolbar button:hover .ql-stroke,
  body.dark-mode .ql-snow .ql-toolbar button:hover .ql-stroke {
    stroke: var(--primary);
  }

  /* Mention Dropdown Styling */
  .ql-mention-list-container {
    width: 250px !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 12px !important;
    background-color: var(--bg-card) !important;
    box-shadow: var(--shadow-md) !important;
    overflow: hidden;
    z-index: 9999;
  }
  .ql-mention-list {
    padding: 0 !important;
    margin: 0 !important;
  }
  .ql-mention-list-item {
    padding: 10px 15px !important;
    color: var(--text-main) !important;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border-color);
    transition: background-color 0.2s;
  }
  .ql-mention-list-item.selected {
    background-color: var(--bg-input) !important;
    color: var(--primary) !important;
    font-weight: bold;
  }

  /* =========================================
     INTERACTIVE IMAGE UPLOAD ZONE
     ========================================= */
  .image-upload-zone {
    border: 2px dashed var(--border-color);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
    cursor: pointer;
    background-color: var(--bg-input);
    transition: all var(--trans-smooth);
  }
  .image-upload-zone:hover {
    border-color: var(--primary);
    background-color: var(--primary-glow);
    transform: translateY(-2px);
  }

  .cover-preview-wrapper {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    display: none; 
  }
  .cover-preview-wrapper img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    display: block;
  }
  .btn-remove-cover {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    color: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-remove-cover:hover {
    background: rgba(220, 53, 69, 0.9);
    transform: scale(1.1);
  }
</style>

<div class="row justify-content-center fade-in-up">
  <div class="col-lg-10 col-xl-9">
    <div class="d-flex align-items-center mb-4 px-2">
      <div
        class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle me-3 shadow-sm"
        style="width: 54px; height: 54px"
      >
        <i class="fas fa-pen-nib fa-lg"></i>
      </div>
      <div>
        <h2 class="font-heading fw-bold mb-0" style="color: var(--text-main)">
          Create a new story
        </h2>
        <p class="text-muted mb-0" style="font-size: 0.95rem">
          Share your thoughts with the community
        </p>
      </div>
    </div>

    <div
      class="card border-0 shadow-sm p-4 p-md-5 mb-5"
      style="border-radius: 24px; background-color: var(--bg-card)"
    >
      <form
        method="POST"
        id="postForm"
        enctype="multipart/form-data"
        onsubmit="return validatePostForm();"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="text" id="hiddenInput" />

        <div class="mb-4">
          <input type="text" name="title" class="form-control form-control-lg fw-bold" placeholder="Story Title (Required)" required maxlength="200" style="font-size: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-input); color: var(--text-main);">
        </div>
        <div class="mb-4">
          <textarea name="excerpt" class="form-control" placeholder="Short excerpt or summary (Optional, max 300 characters)" maxlength="300" rows="2" style="border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-input); color: var(--text-main);"></textarea>
        </div>
        <div class="mb-4">
          <label
            class="form-label fw-bold small text-uppercase"
            style="color: var(--text-muted); letter-spacing: 0.5px"
          >
            Cover Image <span class="fw-normal text-lowercase">(Optional)</span>
          </label>

          <div
            id="uploadZone"
            class="image-upload-zone upload-zone-drop"
          >
            <i
              class="fas fa-images fa-2x mb-2"
              style="color: var(--text-muted); opacity: 0.6"
            ></i>
            <h6 class="fw-bold mb-1" style="color: var(--text-main)">
              Click to browse files or drag here
            </h6>
            <div
              class="small fw-bold opacity-75"
              style="color: var(--text-muted)"
            >
              Supported: JPG, JPEG, PNG, WEBP (Max 5MB)
            </div>
          </div>

          <input
            type="file"
            name="cover_image"
            id="coverImageInput"
            class="d-none crop-upload"
            accept=".jpg, .jpeg, .png, .webp"
            data-aspect-ratio="free"
            data-preview-target="coverPreview"
            data-preview-container="coverPreviewContainer"
            data-upload-zone="uploadZone"
          />

          <div id="coverPreviewContainer" class="cover-preview-wrapper mt-3">
            <img id="coverPreview" src="" alt="Cover Preview" />
            <button
              type="button"
              class="btn-remove-cover"
              onclick="removeCoverImage()"
              title="Remove Image"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label
            class="form-label fw-bold small text-uppercase"
            style="color: var(--text-muted); letter-spacing: 0.5px"
          >
            Your Story
          </label>
          <div class="editor-wrapper">
            <div id="editor-container"></div>
          </div>
        </div>

        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-3 mt-4"
        >
          <small
            class="text-muted fw-bold mb-3 mb-md-0 d-flex align-items-center gap-2"
          >
            <i class="fab fa-markdown fs-5"></i> Supports Markdown shortcuts & @mentions
          </small>

          <div class="d-flex gap-3 w-100 w-md-auto">
            <a
              href="/home"
              class="btn btn-light rounded-pill px-4 fw-bold flex-grow-1 flex-md-grow-0 border shadow-sm"
              style="background-color: var(--bg-input); color: var(--text-main)"
            >
              Cancel
            </a>
            <button
              type="submit"
              class="btn btn-primary rounded-pill px-5 fw-bold flex-grow-1 flex-md-grow-0 shadow-sm d-flex align-items-center justify-content-center gap-2"
            >
              <i class="fas fa-paper-plane" style="font-size: 0.9rem"></i>
              <span>Publish Story</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill-mention@3.1.0/dist/quill.mention.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // 1. Initialize Highlight.js
    hljs.configure({
      languages: ['python', 'javascript', 'html', 'css', 'json', 'bash']
    });
    
    // 2. Custom Quill Image Handler
    function customImageHandler() {
      const input = document.createElement('input');
      input.setAttribute('type', 'file');
      input.setAttribute('accept', 'image/png, image/jpeg, image/jpg, image/webp');
      input.click();

      input.onchange = async () => {
        const file = input.files[0];
        if (/^image\//.test(file.type)) {
          const formData = new FormData();
          formData.append('image', file);
          
          const meta = document.querySelector('meta[name="csrf-token"]');
          const csrfToken = meta ? meta.getAttribute("content") : "";
          
          const btn = document.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Uploading Image...';
          btn.disabled = true;

          try {
            const response = await fetch('/upload-quill-image', {
              method: 'POST',
              headers: { "X-CSRFToken": csrfToken },
              body: formData
            });
            const result = await response.json();
            
            if (result.success) {
              const range = quill.getSelection();
              quill.insertEmbed(range.index, 'image', result.url);
              quill.setSelection(range.index + 1); // Move cursor right after the image
            } else {
              if (typeof showToast === "function") showToast(result.message || "Upload failed", true);
              else alert(result.message || "Upload failed");
            }
          } catch (error) {
            console.error("Upload error:", error);
            if (typeof showToast === "function") showToast("Network error during upload", true);
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        } else {
          if (typeof showToast === "function") showToast("Please select a valid image.", true);
        }
      };
    }

    // 3. Initialize Quill with new Modules
    var quill = new Quill("#editor-container", {
      theme: "snow",
      placeholder: "Start typing your masterpiece... type @ to mention someone!",
      modules: {
        syntax: true, 
        toolbar: {
          container: [
            [{ header: [2, 3, false] }],
            ["bold", "italic", "underline", "link", "blockquote", "code-block", "image"], // 🚀 ADDED IMAGE
            [{ list: "ordered" }, { list: "bullet" }],
            ["clean"],
          ],
          handlers: {
            image: customImageHandler
          }
        },
        mention: {
          allowedChars: /^[A-Za-z\sÅÄÖåäö]*$/,
          mentionDenotationChars: ["@"],
          source: async function (searchTerm, renderList, mentionChar) {
            let matchedPeople = [];
            if (searchTerm.length > 0) {
              try {
                const response = await fetch(`/api/search-users?q=${searchTerm}`);
                const users = await response.json();
                
                matchedPeople = users.map(user => ({
                  id: user.username,
                  value: user.username,
                  avatar: user.profile_pic ? `/static/uploads/avatars/${user.profile_pic}` : null
                }));
              } catch (error) {
                console.error("Mention Search Error:", error);
              }
            }
            renderList(matchedPeople, searchTerm);
          },
          renderItem: function(item) {
            let avatarHtml = item.avatar 
                ? `<img src="${item.avatar}" class="rounded-circle object-fit-cover shadow-sm border" width="24" height="24">`
                : `<div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center shadow-sm" style="width:24px; height:24px; font-size:12px; vertical-align: middle;">${item.value.charAt(0).toUpperCase()}</div>`;
                
            return `${avatarHtml} <span class="ms-2 fw-bold">@${item.value}</span>`;
          }
        }
      },
    });

    // 🚀 UNSAVED CHANGES WARNING LOGIC
    let isSubmitting = false;

    window.addEventListener("beforeunload", function (e) {
      if (isSubmitting) return undefined;
      var text = quill.getText().trim();
      
      var titleText = document.querySelector('input[name="title"]').value.trim();
      var excerptText = document.querySelector('textarea[name="excerpt"]').value.trim();
      
      if (text.length > 0 || titleText.length > 0 || excerptText.length > 0) {
        var confirmationMessage =
          "You have unsaved changes. Are you sure you want to leave?";
        e.returnValue = confirmationMessage; 
        return confirmationMessage; 
      }
    });

    // =========================================
    // IMAGE PREVIEW LOGIC
    // =========================================
    window.removeCoverImage = function () {
      document.getElementById("coverImageInput").value = "";
      document.getElementById("coverPreviewContainer").style.display = "none";
      document.getElementById("uploadZone").style.display = "block";
    };

    // =========================================
    // FORM VALIDATION & SUBMISSION
    // =========================================
    window.validatePostForm = function () {
      var html = quill.root.innerHTML;
      var text = quill.getText().trim();

      if (text.length === 0) {
        if (typeof showToast === "function") {
          showToast("Story content cannot be empty!", true);
        } else {
          alert("Story content cannot be empty!");
        }
        return false;
      }

      isSubmitting = true;
      document.getElementById("hiddenInput").value = html;

      const btn = document.querySelector('button[type="submit"]');
      btn.innerHTML =
        '<i class="fas fa-spinner fa-spin me-2"></i>Publishing...';
      btn.disabled = true;

      return true;
    };
  });
</script>
{% endblock %}
