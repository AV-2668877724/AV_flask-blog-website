{% extends "base.html" %} {% block title %}Finish Signup{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card shadow border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold font-heading">Final Step</h2>
          <p class="text-muted small">Choose your username and password</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-user text-muted"></i
              ></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0 bg-light"
                name="username"
                placeholder="Enter username"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-lock text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                name="password"
                placeholder="Create password"
                required
              />
            </div>
            <div class="form-text">Must be at least 7 characters.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small text-muted"
              >Confirm Password</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-lock text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                name="confirm_password"
                placeholder="Confirm password"
                required
              />
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-success btn-lg rounded-pill fw-bold shadow-sm"
            >
              Create Account
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
