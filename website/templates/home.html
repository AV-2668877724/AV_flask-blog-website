{% extends "base.html" %} {% block title %}Home{% endblock %} {% block content
%}
<div class="row justify-content-center">
  <div class="col-lg-10 col-md-11 mx-auto">
    <div id="posts-container" class="post-feed">
      {% if posts %} {% include "_posts.html" %} {% else %}
      <div class="text-center py-5">
        <i class="bi bi-journal-text display-4 text-muted mb-3"></i>
        <p class="lead text-muted">No stories found here yet.</p>
      </div>
      {% endif %}
    </div>

    {% if posts %}
    <div
      id="sentinel"
      class="text-center py-4"
      data-page="1"
      data-has-next="{{ 'true' if pagination.has_next else 'false' }}"
      data-url="{{ url_for('views.home') }}"
    >
      <div
        id="scroll-spinner"
        class="spinner-border text-primary"
        role="status"
        style="display: none; width: 1.5rem; height: 1.5rem"
      >
        <span class="visually-hidden">Loading...</span>
      </div>

      <p id="end-message" class="text-muted small d-none">
        <i class="fas fa-check-circle me-1"></i> You're all caught up!
      </p>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
