{% extends 'base.html' %}
{% block title %} Forgot Password {% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:480px;">
  <div class="card shadow-lg border-0">
    <div class="card-body p-4">
      <h3 class="text-center mb-3">
        <i class="fas fa-key text-primary me-2"></i> Reset Your Password
      </h3>
      <p class="text-center text-muted mb-4">
        Answer your security questions to set a new password.
      </p>

      <form method="POST">
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required />
          </div>
        </div>

        <!-- Date of Birth (date picker) -->
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-calendar"></i></span>
            <input type="date" class="form-control" id="dob" name="dob" required />
          </div>
        </div>

        <!-- Favorite Person -->
        <div class="mb-3">
          <label for="fav_person" class="form-label">Favorite Person's Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-heart text-danger"></i></span>
            <input type="text" class="form-control" id="fav_person" name="fav_person" placeholder="Enter your favorite person" required />
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password" required />
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required />
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-sync-alt me-1"></i> Reset Password
        </button>

        <!-- Back to login -->
        <div class="text-center mt-3">
          <p class="small">Remembered your password? <a href="/login">Login here</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
