{% extends 'base.html' %} {% block title %} Forgot Password {% endblock %} {%
block content %}

<div class="auth-page mx-auto" style="max-width: 480px">
  <div class="card shadow-lg border-0">
    <div class="card-body p-4">
      <h3 class="text-center mb-3">
        <i class="fas fa-key text-primary me-2"></i> Reset Your Password
      </h3>
      <p class="text-center text-muted mb-4">
        Answer your security questions to set a new password.
      </p>

      <form method="POST">
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fas fa-envelope"></i
            ></span>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <!-- Date of Birth -->
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth</label>
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fas fa-calendar"></i
            ></span>
            <input
              type="date"
              class="form-control"
              id="dob"
              name="dob"
              required
            />
          </div>
        </div>

        <!-- Favorite Person -->
        <div class="mb-3">
          <label for="fav_person" class="form-label"
            >Favorite Person's Name</label
          >
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fas fa-heart text-danger"></i
            ></span>
            <input
              type="text"
              class="form-control"
              id="fav_person"
              name="fav_person"
              placeholder="Enter your favorite person"
              required
            />
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="new_password"
              name="new_password"
              placeholder="Enter new password"
              required
            />
          </div>
          <!-- Strength meter -->
          <div class="progress mt-2" style="height: 5px">
            <div id="resetStrengthBar" class="progress-bar"></div>
          </div>
          <small id="resetStrengthText" class="text-muted"></small>
        </div>

        <script>
          document
            .getElementById("new_password")
            .addEventListener("input", function () {
              const val = this.value;
              const bar = document.getElementById("resetStrengthBar");
              const text = document.getElementById("resetStrengthText");
              let strength = 0;
              if (val.length > 5) strength += 25;
              if (/[A-Z]/.test(val)) strength += 25;
              if (/[0-9]/.test(val)) strength += 25;
              if (/[^A-Za-z0-9]/.test(val)) strength += 25;
              bar.style.width = strength + "%";
              let label = "";
              if (strength < 50) {
                bar.className = "progress-bar bg-danger";
                label = "Weak";
              } else if (strength < 75) {
                bar.className = "progress-bar bg-warning";
                label = "Medium";
              } else {
                bar.className = "progress-bar bg-success";
                label = "Strong";
              }
              text.textContent = `Password strength: ${label}`;
            });
        </script>

        <!-- Confirm New Password -->
        <div class="mb-3">
          <label for="confirm_password" class="form-label"
            >Confirm New Password</label
          >
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="confirm_password"
              name="confirm_password"
              placeholder="Confirm new password"
              required
            />
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-sync-alt me-1"></i> Reset Password
        </button>

        <!-- Back to login -->
        <div class="text-center mt-3">
          <p class="small">
            Remembered your password? <a href="/login">Login here</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Password toggle script -->
<script>
  function setupToggle(toggleId, inputId) {
    const toggleBtn = document.getElementById(toggleId);
    const inputField = document.getElementById(inputId);

    toggleBtn.addEventListener("click", function () {
      const type =
        inputField.getAttribute("type") === "password" ? "text" : "password";
      inputField.setAttribute("type", type);
      this.innerHTML =
        type === "password"
          ? '<i class="fas fa-eye"></i>'
          : '<i class="fas fa-eye-slash"></i>';
    });
  }

  setupToggle("toggleNewPassword", "new_password");
  setupToggle("toggleConfirmPassword", "confirm_password");
</script>

{% endblock %}
