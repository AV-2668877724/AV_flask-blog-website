<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    
    <title>{% block title %}Chat{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/3b08e91fa8.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=99" />

    <style>
        /* True 100vh lock without fighting other UI elements */
        html, body { 
            height: 100%; 
            height: -webkit-fill-available;
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background-color: var(--bg-main); 
        }
        main {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="{% if current_user.is_authenticated and current_user.dark_mode %}dark-mode{% endif %}">
    
    <script>
      (function () {
        const saved = localStorage.getItem("darkMode");
        if (saved === "true" || (saved === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.body.classList.add("dark-mode");
        }
      })();
    </script>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" defer></script>
    
    <script src="{{ url_for('static', filename='index.js') }}" defer></script>
</body>
</html>
