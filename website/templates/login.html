{% extends "base.html" %} {% block title %}Log In - AV Postory{% endblock %} {%
block content %}
<style>
  /* Auth Specific Styling */
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .auth-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color) !important;
    border-radius: 24px;
    box-shadow: var(--shadow-float);
    width: 100%;
    max-width: 420px;
    padding: 3rem 2.5rem;
    position: relative;
    overflow: hidden;
  }

  /* Decorative Background Glow */
  .auth-card::before {
    content: "";
    position: absolute;
    top: -50px;
    right: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(
      circle,
      var(--primary-glow) 0%,
      transparent 70%
    );
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .auth-content {
    position: relative;
    z-index: 1;
  }

  .auth-logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-bottom: 1.5rem;
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }

  /* Password Toggle Button */
  .password-toggle {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    z-index: 10;
    transition: color 0.2s;
  }
  .password-toggle:hover {
    color: var(--primary);
  }
</style>

<div class="auth-wrapper fade-in-up">
  <div class="auth-card">
    <div class="auth-content">
      <div class="text-center mb-4">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="AV Postory"
          class="auth-logo"
        />
        <h2 class="font-heading fw-bold" style="color: var(--text-main)">
          Welcome Back
        </h2>
        <p class="text-muted small">Log in to continue your story.</p>
      </div>

      <form method="POST" id="loginForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="emailInput"
            name="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
          <label for="emailInput">Email address</label>
        </div>

        <div class="form-floating mb-2 position-relative">
          <input
            type="password"
            class="form-control"
            id="passwordInput"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
          <label for="passwordInput">Password</label>
          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            tabindex="-1"
          >
            <i class="far fa-eye" id="toggleIcon"></i>
          </button>
        </div>

        <div class="text-end mb-4">
          <a
            href="{{ url_for('auth.reset_request') }}"
            class="text-decoration-none small fw-bold"
            style="color: var(--primary)"
          >
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2"
          id="loginBtn"
        >
          <span>Log In</span>
          <i class="fas fa-arrow-right" style="font-size: 0.9rem"></i>
        </button>
      </form>

      <div
        class="text-center mt-4 pt-3 border-top"
        style="border-color: var(--border-color) !important"
      >
        <p class="text-muted small mb-0">
          Don't have an account?
          <a
            href="{{ url_for('auth.sign_up') }}"
            class="text-decoration-none fw-bold ms-1"
            style="color: var(--primary)"
            >Sign up now</a
          >
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  // 1. Show/Hide Password Logic
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("passwordInput");
  const toggleIcon = document.getElementById("toggleIcon");

  if (togglePassword) {
    togglePassword.addEventListener("click", function () {
      // Toggle the type attribute
      const type =
        passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);

      // Toggle the eye icon
      if (type === "text") {
        toggleIcon.classList.remove("fa-eye");
        toggleIcon.classList.add("fa-eye-slash");
      } else {
        toggleIcon.classList.remove("fa-eye-slash");
        toggleIcon.classList.add("fa-eye");
      }
    });
  }

  // 2. Button Loading State
  document.getElementById("loginForm").addEventListener("submit", function () {
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  });
</script>
{% endblock %}
