{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 75vh"
>
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-5">
          <div
            class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
            style="width: 60px; height: 60px"
          >
            <i class="fas fa-fingerprint fa-2x"></i>
          </div>
          <h2 class="fw-bold font-heading">Welcome Back</h2>
          <p class="text-muted">Sign in to continue your journey</p>
        </div>

        <form method="POST">
          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control bg-light border-0"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
            />
            <label for="email" class="text-muted"
              ><i class="fas fa-envelope me-2"></i>Email Address</label
            >
          </div>

          <div class="form-floating mb-2">
            <input
              type="password"
              class="form-control bg-light border-0"
              id="password"
              name="password"
              placeholder="Password"
              required
            />
            <label for="password" class="text-muted"
              ><i class="fas fa-lock me-2"></i>Password</label
            >
          </div>

          <div class="d-flex justify-content-end mb-4">
            <a
              href="/reset_password"
              class="small text-decoration-none text-primary fw-bold"
              >Forgot Password?</a
            >
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg rounded-pill fw-bold"
            >
              Log In
            </button>
          </div>
        </form>

        <div class="text-center mt-5 pt-4 border-top">
          <p class="text-muted small mb-1">New to AV Postory?</p>
          <a
            href="/sign-up"
            class="fw-bold text-decoration-none btn btn-outline-primary rounded-pill btn-sm px-4 mt-2"
            >Create an account</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
