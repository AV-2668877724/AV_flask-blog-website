{% extends 'base.html' %} {% block title %} Login {% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <h2 class="font-heading fw-bold">Welcome Back</h2>
      <p class="text-muted">Please enter your details.</p>
    </div>

    <div class="card border-0 shadow-sm p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-bold text-muted text-uppercase"
            >Email or Username</label
          >
          <input type="text" class="form-control" name="login" required />
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between">
            <label class="form-label small fw-bold text-muted text-uppercase"
              >Password</label
            >
            <a href="/forgot-password" class="small text-decoration-none"
              >Forgot password?</a
            >
          </div>
          <input
            type="password"
            class="form-control"
            name="password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
          Sign in
        </button>

        <div class="text-center">
          <small class="text-muted"
            >Don't have an account?
            <a href="/sign-up" class="fw-bold">Sign up</a></small
          >
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
