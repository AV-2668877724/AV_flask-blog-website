{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card shadow border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold font-heading">Welcome Back</h2>
          <p class="text-muted small">Sign in to continue to your dashboard</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label fw-bold small text-muted"
              >Email Address</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-envelope text-muted"></i
              ></span>
              <input
                type="email"
                class="form-control border-start-0 ps-0 bg-light"
                id="email"
                name="email"
                placeholder="name@example.com"
                required
              />
            </div>
          </div>

          <div class="mb-2">
            <label for="password" class="form-label fw-bold small text-muted"
              >Password</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-lock text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <div class="d-flex justify-content-end mb-4">
            <a
              href="/reset_password"
              class="small text-decoration-none text-primary fw-bold"
              >Forgot Password?</a
            >
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm"
            >
              Log In
            </button>
          </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">Don't have an account?</p>
          <a href="/sign-up" class="fw-bold text-decoration-none"
            >Create an account</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
