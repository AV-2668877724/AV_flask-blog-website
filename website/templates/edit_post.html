{% extends "base.html" %} {% block title %}Edit Post{% endblock %} {% block
content %}

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

<style>
  /* =========================================
     PREMIUM QUILL EDITOR STYLES (Matched with create_posts)
     ========================================= */
  .editor-wrapper {
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    overflow: hidden;
    background-color: var(--bg-card);
    transition: all var(--trans-smooth);
  }
  .editor-wrapper:focus-within {
    box-shadow: 0 0 0 4px var(--primary-glow);
    border-color: var(--primary);
  }

  /* Toolbar Styling */
  .ql-toolbar.ql-snow {
    border: none !important;
    border-bottom: 1px solid var(--border-color) !important;
    background-color: var(--bg-input) !important;
    padding: 12px 20px !important;
  }

  /* Text Area Styling */
  .ql-container.ql-snow {
    border: none !important;
    background-color: transparent !important;
    color: var(--text-main) !important;
    font-size: 1.15rem !important;
    font-family: var(--font-sans) !important;
  }
  .ql-editor {
    min-height: 350px;
    padding: 2rem !important;
    line-height: 1.8;
  }
  .ql-editor.ql-blank::before {
    color: var(--text-muted);
    font-style: italic;
    opacity: 0.7;
    left: 2rem;
  }

  /* Quill Icons & Dark Mode Support */
  body.dark-mode .ql-snow .ql-stroke {
    stroke: var(--text-muted);
  }
  body.dark-mode .ql-snow .ql-fill {
    fill: var(--text-muted);
  }
  body.dark-mode .ql-snow .ql-picker {
    color: var(--text-muted);
  }
  body.dark-mode .ql-snow.ql-toolbar button:hover .ql-stroke,
  body.dark-mode .ql-snow .ql-toolbar button:hover .ql-stroke {
    stroke: var(--primary);
  }
</style>

<div class="row justify-content-center fade-in-up">
  <div class="col-lg-9 col-xl-8">
    <div class="d-flex align-items-center mb-4 px-2">
      <a
        href="{{ url_for('views.home') }}"
        class="btn btn-icon text-muted shadow-sm bg-card me-3"
        style="width: 40px; height: 40px"
      >
        <i class="fas fa-arrow-left"></i>
      </a>
      <div>
        <h3 class="font-heading fw-bold mb-0" style="color: var(--text-main)">
          Edit Story
        </h3>
      </div>
    </div>

    <div
      class="card border-0 shadow-md p-4 p-md-5 mb-5"
      style="
        border-radius: var(--border-radius-lg);
        background-color: var(--bg-card);
      "
    >
      <form
        method="POST"
        enctype="multipart/form-data"
        id="editPostForm"
        onsubmit="return validateEditForm();"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="text" id="hiddenInput" />

        <div class="mb-5 shadow-sm" style="border-radius: 16px">
          <div class="editor-wrapper">
            <div id="editor-container">{{ content_to_edit|safe }}</div>
          </div>
        </div>

        <h5 class="fw-bold font-heading mb-3" style="color: var(--text-main)">
          Cover Image
        </h5>
        <div
          class="p-4 border border-2 border-dashed rounded-4 mb-4"
          style="
            border-color: var(--border-color) !important;
            background-color: var(--bg-input);
          "
        >
          <div class="text-center">
            {% if post.cover_image %}
            <div class="position-relative d-inline-block mb-3">
              <img
                src="{% if 'http' in post.cover_image %}{{ post.cover_image }}{% else %}{{ url_for('static', filename='uploads/posts/' + post.cover_image) }}{% endif %}"
                class="img-fluid rounded-3 shadow-sm"
                style="max-height: 200px; object-fit: cover"
                alt="Current Cover"
              />
            </div>
            <div class="small mt-2 fw-bold text-muted">
              <i class="fas fa-sync-alt me-1"></i> Uploading a new image will
              replace this one.
            </div>
            {% else %}
            <div
              class="d-inline-flex align-items-center justify-content-center bg-secondary bg-opacity-10 text-muted rounded-circle mb-3"
              style="width: 60px; height: 60px"
            >
              <i class="fas fa-image fa-2x opacity-50"></i>
            </div>
            <p class="mb-0 text-muted fw-bold">No image currently attached.</p>
            {% endif %}
          </div>
        </div>

        <div class="mb-4">
          <input
            type="file"
            name="cover_image"
            class="form-control bg-light border-0 py-3 rounded-4 shadow-sm"
            accept="image/*"
          />
        </div>

        <div
          class="d-flex justify-content-end border-top pt-4 mt-2"
          style="border-color: var(--border-color) !important"
        >
          <button
            type="submit"
            class="btn btn-primary rounded-pill fw-bold px-5 py-2 shadow-sm w-100 w-md-auto"
          >
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Initialize Quill
    var quill = new Quill("#editor-container", {
      theme: "snow",
      placeholder: "What's on your mind?",
      modules: {
        toolbar: [
          [{ header: [2, 3, false] }],
          ["bold", "italic", "underline", "link", "blockquote"],
          [{ list: "ordered" }, { list: "bullet" }],
          ["clean"],
        ],
      },
    });

    // Form Submission Logic
    window.validateEditForm = function () {
      var html = quill.root.innerHTML;
      var text = quill.getText().trim();

      if (text.length === 0) {
        if (typeof showToast === "function") {
          showToast("Content cannot be empty!", true);
        } else {
          alert("Content cannot be empty!");
        }
        return false;
      }

      // Inject quill HTML into hidden input for backend
      document.getElementById("hiddenInput").value = html;

      // Change button state to loading
      const btn = document.querySelector('button[type="submit"]');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving...';
      btn.disabled = true;

      return true;
    };
  });
</script>

{% endblock %}
