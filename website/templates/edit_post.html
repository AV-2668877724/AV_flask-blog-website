{% extends 'base.html' %} {% block title %}Edit Story{% endblock %} {% block
content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h2 class="font-heading fw-bold mb-4">Edit your story</h2>
    <div class="card border-0 shadow-sm p-4">
      <form method="POST" onsubmit="return validatePostForm()">
        <div class="mb-3">
          <textarea
            name="text"
            id="text"
            class="form-control border-0 fs-5"
            style="min-height: 200px; resize: none"
            placeholder="What's on your mind?"
          >
{{ post.text }}</textarea
          >
        </div>
        <div class="d-flex justify-content-end gap-2 border-top pt-3">
          <a href="/home" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  function validatePostForm() {
    return (
      document.getElementById("text").value.trim() !== "" ||
      (alert("Content cannot be empty"), false)
    );
  }
</script>
{% endblock %}
