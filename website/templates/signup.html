{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card shadow border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold font-heading">Join AV Postory</h2>
          <p class="text-muted small">Create your unique identity</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-user text-muted"></i>
              </span>
              <input
                type="text"
                class="form-control border-start-0 ps-0 bg-light"
                name="username"
                id="signupUsername"
                placeholder="Choose a username"
                required
                autocomplete="off"
                onkeyup="checkSignupUsername()"
              />
            </div>
            <div
              id="signupUsernameStatus"
              class="form-text small mt-1 fw-bold"
            ></div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small text-muted"
              >Email Address</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-envelope text-muted"></i>
              </span>
              <input
                type="email"
                class="form-control border-start-0 ps-0 bg-light"
                name="email"
                placeholder="name@example.com"
                required
              />
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              id="signupSubmitBtn"
              class="btn btn-primary btn-lg rounded-pill fw-bold"
              disabled
            >
              Send OTP
            </button>
          </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">Already have an account?</p>
          <a href="/login" class="fw-bold text-decoration-none">Log In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
