{% extends "base.html" %} {% block title %}Sign Up - AV Postory{% endblock %} {%
block content %}
<style>
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color) !important;
    border-radius: 24px;
    box-shadow: var(--shadow-float);
    width: 100%;
    max-width: 420px;
    padding: 3rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: "";
    position: absolute;
    top: -50px;
    left: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(
      circle,
      var(--primary-glow) 0%,
      transparent 70%
    );
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .auth-content {
    position: relative;
    z-index: 1;
  }
  .auth-logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-bottom: 1.5rem;
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }

  /* Adaptive Input Styling for Dark Mode */
  .auth-input {
    background-color: var(--bg-input) !important;
    color: var(--text-main) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    font-size: 1rem;
    transition: all var(--trans-smooth);
  }
  .auth-input:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 4px var(--primary-glow) !important;
  }
</style>

<div class="auth-wrapper fade-in-up">
  <div class="auth-card">
    <div class="auth-content">
      <div class="text-center mb-4">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="AV Postory"
          class="auth-logo"
        />
        <h2 class="font-heading fw-bold" style="color: var(--text-main)">
          Create Account
        </h2>
        <p class="text-muted small">Join AV Postory today.</p>
      </div>

      <form method="POST" id="signupForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="mb-4 text-start">
          <label
            for="emailInput"
            class="form-label fw-bold small text-muted ms-1"
            >Email address</label
          >
          <input
            type="email"
            class="form-control auth-input shadow-sm"
            id="emailInput"
            name="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2"
          id="signupBtn"
        >
          <span>Send Verification Code</span>
          <i class="fas fa-paper-plane" style="font-size: 0.9rem"></i>
        </button>
      </form>

      <div
        class="text-center mt-4 pt-3 border-top"
        style="border-color: var(--border-color) !important"
      >
        <p class="text-muted small mb-0">
          Already have an account?
          <a
            href="{{ url_for('auth.login') }}"
            class="text-decoration-none fw-bold ms-1"
            style="color: var(--primary)"
            >Log in</a
          >
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("signupForm").addEventListener("submit", function () {
    const btn = document.getElementById("signupBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';
  });
</script>
{% endblock %}
