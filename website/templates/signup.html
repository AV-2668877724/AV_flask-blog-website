{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 75vh"
>
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-5">
          <div
            class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
            style="width: 60px; height: 60px"
          >
            <i class="fas fa-user-astronaut fa-2x"></i>
          </div>
          <h2 class="fw-bold font-heading">Join AV Postory</h2>
          <p class="text-muted">Step 1: Verify your email address</p>
        </div>

        <form method="POST">
          <div class="form-floating mb-4">
            <input
              type="email"
              class="form-control bg-light border-0"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
            />
            <label for="email" class="text-muted"
              ><i class="fas fa-envelope me-2"></i>Email Address</label
            >
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg rounded-pill fw-bold"
            >
              Send Verification Code
            </button>
          </div>
        </form>

        <div class="text-center mt-5 pt-4 border-top">
          <p class="text-muted small mb-1">Already part of the community?</p>
          <a
            href="/login"
            class="fw-bold text-decoration-none btn btn-outline-secondary rounded-pill btn-sm px-4 mt-2"
            >Log In</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
