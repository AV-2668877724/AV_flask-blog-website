{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card shadow border-0 auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold font-heading">Join AV Postory</h2>
          <p class="text-muted small">
            Create an account to start sharing your stories
          </p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label for="username" class="form-label fw-bold small text-muted"
              >Username</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-user text-muted"></i
              ></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0 bg-light"
                id="username"
                name="username"
                placeholder="Enter username"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-bold small text-muted"
              >Email Address</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-envelope text-muted"></i
              ></span>
              <input
                type="email"
                class="form-control border-start-0 ps-0 bg-light"
                id="email"
                name="email"
                placeholder="name@example.com"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-bold small text-muted"
              >Password</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-lock text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                id="password"
                name="password"
                placeholder="Create a password"
                required
              />
            </div>
            <div class="form-text">Must be at least 7 characters.</div>
          </div>

          <div class="mb-4">
            <label
              for="confirm_password"
              class="form-label fw-bold small text-muted"
              >Confirm Password</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-lock text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0 bg-light"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                required
              />
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm"
            >
              Sign Up
            </button>
          </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">Already have an account?</p>
          <a href="/login" class="fw-bold text-decoration-none">Log In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
