{% extends "base.html" %} {% block title %}Reset Password - AV Postory{%
endblock %} {% block content %}
<style>
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color) !important;
    border-radius: 24px;
    box-shadow: var(--shadow-float);
    width: 100%;
    max-width: 420px;
    padding: 3rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: "";
    position: absolute;
    top: -50px;
    left: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(
      circle,
      var(--primary-glow) 0%,
      transparent 70%
    );
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .auth-content {
    position: relative;
    z-index: 1;
  }
</style>

<div class="auth-wrapper fade-in-up">
  <div class="auth-card">
    <div class="auth-content">
      <div class="text-center mb-4">
        <div
          class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 shadow-sm"
          style="width: 60px; height: 60px"
        >
          <i class="fas fa-key fa-2x"></i>
        </div>
        <h3 class="font-heading fw-bold" style="color: var(--text-main)">
          Reset Password
        </h3>
        <p class="text-muted small">
          Enter your email and we'll send you a link to get back into your
          account.
        </p>
      </div>

      <form method="POST" id="resetRequestForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-floating mb-4">
          <input
            type="email"
            class="form-control"
            id="emailInput"
            name="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          />
          <label for="emailInput">Email address</label>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm"
          id="resetBtn"
        >
          Send Reset Link
        </button>
      </form>

      <div
        class="text-center mt-4 pt-3 border-top"
        style="border-color: var(--border-color) !important"
      >
        <a
          href="{{ url_for('auth.login') }}"
          class="text-decoration-none small text-muted hover-opacity-100 fw-bold"
        >
          <i class="fas fa-arrow-left me-1"></i> Back to Login
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  document
    .getElementById("resetRequestForm")
    .addEventListener("submit", function () {
      const btn = document.getElementById("resetBtn");
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';
    });
</script>
{% endblock %}
