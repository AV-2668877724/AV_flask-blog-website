{% extends "base.html" %} 
{% block title %}Reset Password{% endblock %} 
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-3 text-center">Reset Password</h3>
        <p class="text-muted text-center mb-4 small">Enter your email and we'll send you a link to get back into your account.</p>
        
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold small">Email Address</label>
            <input type="email" class="form-control" name="email" placeholder="Enter your email" required />
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
            <a href="/login" class="btn btn-link text-decoration-none text-muted">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
